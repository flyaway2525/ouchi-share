<!-- PNG 書き出し用の角なし・全面塗りのアイコン。
     iPhone は角丸を自動で付け、透明部分を黒で塗るので、角丸なしで背景を全面に塗る。
     家の形は中心から半径 40% 以内に収まっているので、Android の maskable アイコンにもそのまま使える。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f08a4b"/>
  <path d="M256 104 92 240h44v168h240V240h44L256 104Z" fill="#fff8f0"/>
  <path d="m196 300 42 42 82-86" fill="none" stroke="#f08a4b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
